# .goreleaser.yml — gbounce release pipeline
#
# Triggered on: push of a v* tag (see .github/workflows/release.yml).
# Snapshot validation: goreleaser release --snapshot --clean (no publish).
# Config check:       goreleaser check
#
# Produces per tagged release:
#   .tar.gz / .zip  → linux/darwin/windows, amd64/arm64
#   .deb / .rpm     → linux amd64 + arm64
#   docker          → ghcr.io/trsreagan3/gbounce linux/amd64 + linux/arm64
#   brew            → trsreagan3/homebrew-tap Formula/gbounce.rb
#   scoop           → trsreagan3/scoop-bucket bucket/gbounce.json
#
# NOTE: deb/rpm artifacts are attached to GitHub Releases; NOT published to a
# public APT/RPM registry (follow-up post-v1.0 work).
# Per [[vendor-integration-claim-qualifier]]: built + smoke-tested in CI;
# NOT published to public deb/rpm package registry.
#
# PREREQUISITES before the first real tagged release:
#   1. Create https://github.com/trsreagan3/homebrew-tap (public repo,
#      stub Formula/ dir). Secret: HOMEBREW_TAP_TOKEN (repo scope PAT).
#   2. Create https://github.com/trsreagan3/scoop-bucket (public repo,
#      stub bucket/ dir). Secret: SCOOP_BUCKET_TOKEN (repo scope PAT).
#   3. Confirm ghcr.io/trsreagan3/gbounce package visibility on GitHub.
#   4. DO NOT push a v* tag until launch readiness is confirmed.

version: 2

project_name: gbounce

before:
  hooks:
    - go mod tidy

# ── Builds ────────────────────────────────────────────────────────────────────
builds:
  - id: gbounce
    binary: gbounce
    main: ./cmd/gbounce
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      # Stamp the three vars declared in internal/cli/cli.go.
      # Use .ShortCommit (7-char SHA) to match what the Makefile + Dockerfile emit.
      - -s -w
      - -X github.com/trsreagan3/gbounce/internal/cli.version={{.Version}}
      - -X github.com/trsreagan3/gbounce/internal/cli.commit={{.ShortCommit}}
      - -X github.com/trsreagan3/gbounce/internal/cli.buildTime={{.Date}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    # windows: syscall.Statfs_t in internal/audit/rotation.go is unix-only;
    # windows builds require adding a build-tag guard first. Tracked as
    # follow-up work — add back once rotation.go has a //go:build !windows stub.

# ── Archives ──────────────────────────────────────────────────────────────────
archives:
  - id: gbounce-archive
    ids:
      - gbounce
    name_template: "gbounce_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

# ── Checksums ─────────────────────────────────────────────────────────────────
checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# ── Native packages (deb + rpm) ───────────────────────────────────────────────
nfpms:
  - id: gbounce-deb-rpm
    package_name: gbounce
    ids:
      - gbounce
    vendor: trsreagan3
    homepage: https://github.com/trsreagan3/gbounce
    maintainer: trsreagan3
    description: |
      Generic HTTP/HTTPS forward-proxy safety layer for AI agents and dev workflows.
      gbounce sits between your agent and the internet, auditing every HTTP call
      and (optionally) denying out-of-profile requests by host, path, or method.
    license: Apache-2.0
    section: net
    formats:
      - deb
      - rpm
    bindir: /usr/local/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/gbounce/copyright
      - src: README.md
        dst: /usr/share/doc/gbounce/README.md
    scripts:
      postinstall: scripts/nfpm/postinstall.sh

# ── Homebrew tap ──────────────────────────────────────────────────────────────
# Writes Formula/gbounce.rb to trsreagan3/homebrew-tap on release.
# Requires HOMEBREW_TAP_TOKEN secret. Tap repo must exist first.
# NOTE: goreleaser free tier uses `brews` (goreleaser Pro uses `homebrew`).
# `brews` is deprecated upstream but remains the only non-Pro stanza in v2.
brews:
  - name: gbounce
    repository:
      owner: trsreagan3
      name: homebrew-tap
      branch: "bump-gbounce-{{.Version}}"
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: trsreagan3
          name: homebrew-tap
          branch: main
    homepage: https://github.com/trsreagan3/gbounce
    description: "Generic HTTP/HTTPS forward-proxy safety layer for AI agents and dev workflows"
    license: Apache-2.0
    install: |
      ldflags = %W[
        -s -w
        -X github.com/trsreagan3/gbounce/internal/cli.version=#{version}
        -X github.com/trsreagan3/gbounce/internal/cli.commit=homebrew
        -X github.com/trsreagan3/gbounce/internal/cli.buildTime=#{time.iso8601}
      ]
      system "go", "build", "-trimpath", "-ldflags", ldflags.join(" "), "-o", bin/"gbounce", "./cmd/gbounce"
    test: |
      assert_match version.to_s, shell_output("#{bin}/gbounce --version")
      assert_match "gbounce", shell_output("#{bin}/gbounce --help")

# ── Scoop bucket ──────────────────────────────────────────────────────────────
# Writes bucket/gbounce.json to trsreagan3/scoop-bucket on release.
# Requires SCOOP_BUCKET_TOKEN secret. Bucket repo must exist first.
scoops:
  - repository:
      owner: trsreagan3
      name: scoop-bucket
      branch: "bump-gbounce-{{.Version}}"
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: trsreagan3
          name: scoop-bucket
          branch: main
    name: gbounce
    homepage: https://github.com/trsreagan3/gbounce
    description: "Generic HTTP/HTTPS forward-proxy safety layer for AI agents and dev workflows"
    license: Apache-2.0

# ── Docker images ─────────────────────────────────────────────────────────────
# Uses Dockerfile.goreleaser (distroless; goreleaser copies the binary in).
# KEEP PRIVATE: visibility is controlled on GHCR, not here.
# Images will NOT be pushed until a real tag triggers the release workflow.
dockers:
  - id: gbounce-linux-amd64
    goos: linux
    goarch: amd64
    image_templates:
      - "ghcr.io/trsreagan3/gbounce:{{ .Version }}-amd64"
      - "ghcr.io/trsreagan3/gbounce:latest-amd64"
    dockerfile: Dockerfile.goreleaser
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.source=https://github.com/trsreagan3/gbounce"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"
      - "--label=org.opencontainers.image.title=gbounce"
      - "--label=org.opencontainers.image.description=Generic HTTP/HTTPS forward proxy with OCSF audit-export"

  - id: gbounce-linux-arm64
    goos: linux
    goarch: arm64
    image_templates:
      - "ghcr.io/trsreagan3/gbounce:{{ .Version }}-arm64"
      - "ghcr.io/trsreagan3/gbounce:latest-arm64"
    dockerfile: Dockerfile.goreleaser
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.source=https://github.com/trsreagan3/gbounce"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"
      - "--label=org.opencontainers.image.title=gbounce"
      - "--label=org.opencontainers.image.description=Generic HTTP/HTTPS forward proxy with OCSF audit-export"

docker_manifests:
  - name_template: "ghcr.io/trsreagan3/gbounce:{{ .Version }}"
    image_templates:
      - "ghcr.io/trsreagan3/gbounce:{{ .Version }}-amd64"
      - "ghcr.io/trsreagan3/gbounce:{{ .Version }}-arm64"

  - name_template: "ghcr.io/trsreagan3/gbounce:latest"
    image_templates:
      - "ghcr.io/trsreagan3/gbounce:latest-amd64"
      - "ghcr.io/trsreagan3/gbounce:latest-arm64"

# ── Release ───────────────────────────────────────────────────────────────────
release:
  github:
    owner: trsreagan3
    name: gbounce
  name_template: "v{{.Version}}"
  draft: false
  prerelease: auto

# ── Changelog ─────────────────────────────────────────────────────────────────
changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"
