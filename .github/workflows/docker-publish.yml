name: docker-publish

# Publishes ghcr.io/trsreagan3/gbounce on:
#   - push to main         → :main
#   - push of a v* git tag → :vX.Y.Z + :latest
#
# Image is a packaging convenience (per [[ibounce-honest-positioning]]) —
# same binary as `go install`. No telemetry. Multi-arch (linux/amd64 +
# linux/arm64). Distroless static base.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: trsreagan3/gbounce

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute build metadata
        id: meta-vars
        run: |
          VERSION="$(git describe --tags --always --dirty)"
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=${COMMIT}"   >> "$GITHUB_OUTPUT"
          echo "build_time=${BUILD_TIME}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for arm64 builds on amd64 runners)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags + OCI labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # ---- Smoke test (single-arch) before pushing multi-arch ----
      - name: Smoke build (amd64, load to local daemon)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: gbounce:smoke
          build-args: |
            VERSION=${{ steps.meta-vars.outputs.version }}
            COMMIT=${{ steps.meta-vars.outputs.commit }}
            BUILD_TIME=${{ steps.meta-vars.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — --version
        run: docker run --rm gbounce:smoke --version

      - name: Smoke test — --help
        run: docker run --rm gbounce:smoke --help

      - name: Smoke test — image size report
        run: |
          docker images gbounce:smoke --format '{{.Repository}}:{{.Tag}} {{.Size}}'

      # ---- Multi-arch build + push ----
      - name: Build and push (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta-vars.outputs.version }}
            COMMIT=${{ steps.meta-vars.outputs.commit }}
            BUILD_TIME=${{ steps.meta-vars.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
